<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String object</title>
    <script>
        //3.String 생성자 함수 - 문자열 처리에 관련된 여러 기능들 설계
        //기초타입 string과 구별
        var a='sam';
        var b=new String('sam'); //string 의 wrapper임

        document.write(typeof(a) +'<br>');
        document.write(typeof(b) +'<br>');
        document.write((a===b)+ '<hr>');

        //string의 유용한 변수와 기능들(function-함수-메소드)
        var s='Hello World'; //자동으로 String객체로 Wrapping..

        //1) 글자 수를 갖고 있는 맴버변수(속성)
        document.write(s.length +'<br>');

        //2) 대소문자 변환 기능
        document.write(s.toUpperCase()+'<br>'); 
        document.write(s.toLowerCase()+'<br>');
        document.write(s +'<br>'); //원본은 안바뀜

        //3) 글씨 결합하기
        document.write(s.concat('Nice')+'<br>');
        document.write(s +'<br>'); //원본은 안바뀜
        //문자열의 결합은 매우 많이 사용하지만.. concat()은 많이 안씀..
        //문자열의 + 결합 연산자를 더 많이 씀
        document.write(s+'Nice'+ '<br>');

        //4) 특정 문자가 있는 위치번호(index번호 0,1,2,3,4,5...) 얻어오기
        document.write(s.indexOf('World') +'<br>'); //해당 문자의 첫 글자 자리 번호
        document.write(s.indexOf('sss') +'<br>'); //못찾으면 -1
        //검색할 때 대소문자 구별?
        document.write(s.indexOf('world') +'<br>')  //-1
        //대소문자 구별없이 검색하고 싶다면,.옵션 주기..민감하지 않게 i:insensitive
        document.write(s.indexOf(/world/i) +'<br>'); //슬래쉬로 문자열을 쓰는 방식(정규 표현식-- 추후 수업 예정)

        //5)문자열 안에 원하는 문자를 검색해 추출(문자탐색..match)
        var str='Hello world! Nice to meet you.안녕하세요. 반갑습니다.Nice work! nice study.'
        
        var word= str.match('Hello');
        document.write('검색글자:'+word+'<br>');

        var word= str.match('good');
        document.write('검색글자:'+word+'<br>'); //못찾으면 null

        //대소문자 구별 ?
        var word= str.match('hello');
        document.write('검색글자:'+word+'<br>');

        //대소문자 구별하고 싶다면.. 옵션.민감하지 않게 i:insensitive
        document.write(str.match(/hello/i)+ '<br>');

        //여러개의 같은 문자가 있을 때 찾아지는지...
        var words=str.match(/Nice/); //1개만 찾음
        document.write('탐색된 글자들: '+ words+ '<br>');
        //여러개를 찾고 싶다면..전체에서 검색하도록 옵션 주기.. global
        var words=str.match(/Nice/g);
        document.write('탐색된 글자들: '+ words+ '<br>');
        //대소문자 구별없이 모든 같은 문자들 탐색하려면.. 옵션 2개 모두 사용
        var words=str.match(/Nice/ig);
        document.write('탐색된 글자들: '+ words+ '<br>');

        document.write('<hr>');

        //6) 문자 바꿔치기.. replace
        var s ='Hello world';
        document.write(s.replace('world','web')+'<br>'); //원본은 그대로
        document.write(s.replace('nice','web')+'<br>'); //없는 글자를 바꾸려하면 그냥 변화 없이 그대로 나옴.

        document.write(s.replace('wolrD','web')+'<br>'); //안바뀜
        document.write(s.replace(/worlD/i,'web')+'<br>'); // 이건 바뀜

        //여러개의 단어를 동시에 모두 바꾸려면...
        var str='hello world. nice world. good world. bad world';
        document.write(str.replace('world','AI')+'<br>');
        document.write(str.replace(/world/ig,'AI')+'<br>');

        //문자열 사이사이에 있는 모든 공백 문자를 없앨 때도 활용이 가능
        var result=str.replace(/ /g, ''); //공백 문자를 빈 문자열로 바꾸기
        document.write(result+'<hr>');

        //7) 문자열을 특정 문자 기준으로 잘라서 배열로 리턴해주는 기능 (csv파일 분석에 많이 활용)
        var s='one,two,three,four,five';
        var aaa=s.split(','); //,를 기준으로 자름
        document.write('요소의 개수:'+aaa.length+ '<br>');

        document.write(aaa[0]+'<br>');
        document.write(aaa[1]+'<br>');
        document.write(aaa[2]+'<br>');
        document.write(aaa[3]+'<br>');
        document.write(aaa[4]+'<br>');

    </script>
</head>
<body>
    
</body>
</html>
