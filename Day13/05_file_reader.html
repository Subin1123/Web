<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS File reader</title>
</head>
<body>
    <h2>텍스트 파일 데이터 읽기</h2>
    <input type="file" id="in1">
    <button onclick="aaa()">파일 데이터 읽기</button>
    <textarea id="ta" cols="30" rows="10"></textarea>
    <script>
        function aaa(){
            //사용자가 선택한 파일의 데이터를 읽어오는 능력을 가진 Filereader 객체를 생성해 읽어오기
            //보안상의 문제로 사용자가 선택한 파일만 읽을 수 있음.. 파일 경로를 직접 개발자가 쓸 수 없음
            //보안상의 문제로 사용자의 컴퓨터에 파일을 쓸 수 있는 기능은 제공되지 않음

            //사용자가 선택한 파일정보 가져오기
            var f=document.getElementById('in1').value;
            //alert(f); //value로 취득한 경로는 실제 파일 경로가 아님 가짜 경로. fakePath...
            //가짜 경로로는 파일 읽기 불가
            //사용자가 선택한 파일 객체를 그대로 받아오기
            var files=document.getElementById('in1').files; //여러개 선택될 수 있어서 무조건 배열로 줌.
            alert(files[0].name+"\n"+files[0].size+'\n'+files[0].type);

            //실제 파일 데이터 읽어오기

            //1.파일리더 객체 생성
            var fr=new FileReader();

            //3.파일을 읽어오는 작업이 오래걸림. 그래서 완료가 되면 자동으로 실행되는 함수를 등록
            //읽기 요청보다 먼저 등록해야함(권장)
            fr.onload=function(){
                document.getElementById('ta').innerHTML=fr.result; //리더가 읽어드린 결과
            }

            //2.파일리더에게 텍스트로 데이터를 읽어달라고 요청
            fr.readAsText(files[0],"utf-8");
        }
    </script>

    <hr>
    <!-- 사용자가 선택한 이미지의 미리보기 구현 -->
    <h2>이미지파일 읽기 및 미리보기</h2>
    <input type="file" id="in2" multiple onchange="bbb()">
<hr>
<div id="box"></div>

<script>
function bbb(){

    var files = document.getElementById('in2').files;
    var box = document.getElementById('box');

    box.innerHTML = ""; // 기존 미리보기 삭제

    for(let i = 0; i < files.length; i++){

        let fr = new FileReader();

        fr.onload = function(){

            let img = document.createElement("img");
            img.src = fr.result;
            img.style.border = "4px solid black";
            img.style.maxWidth = "200px";
            img.style.margin = "10px";

            box.appendChild(img);
        }

        fr.readAsDataURL(files[i]);
    }
}
</script>
</body>
</html>
