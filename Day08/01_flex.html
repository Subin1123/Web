<!-- 1차원 레이아웃을 효율적으로 유연하게 해주는 스타일: flex -->
<!-- 2차원 레이아웃 구조를 효율적으로 만들 수 있는 스타일: grid -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex style</title>

    <style>
        #container>div{
            background-color: aqua;
            margin: 10px;
            padding: 20px;

        }

        #container{
            /* 자식요소들의 배치방식을 부모요소가 제어하도록... */
            display: flex;

            /* 자식요소의 배치 방향을 설정 */
            flex-direction: row; /*기본값: 옆으로 배치*/
            flex-direction: column; /*밑으로 배치*/
            flex-direction: row-reverse; /*역방향*/
            flex-direction: column-reverse;

            flex-direction: row;

            /* 자식 요소가 많아서 부모요소의 영역을 벗어날 때.. 처리 방식을 정할 수 있음 */

            flex-wrap: nowrap; /*기본*/
            flex-wrap: wrap;
            flex-wrap: wrap-reverse; /*줄바꿈할 때.. 새로 생기는 줄이 위로..*/


            /* direction-wrap을 축약으로.. */
            flex-flow: column wrap;
            flex-flow: nowrap column; /*순서 상관 X*/

            /* 기본 값 */
            flex-flow: row nowrap;

            /* 자식 요소들의 정렬 속성 2가지*/
            /* justify-content, align-items */

            /* 1.justify-content : direction(배치) 방향의 정렬 */
            /* 1.1 수평배치일 때... 수평 축 정렬*/
            flex-direction: row;
            justify-content: center;
            justify-content: flex-end; /*배치 방향의 끝*/
            justify-content: flex-start; /*기본값*/
            justify-content: space-between;
            justify-content: space-around;
            justify-content: space-evenly;


            /* 1.2 수직배치일 때... */
            flex-direction: column;
            justify-content: flex-start;
            justify-content: center;
            justify-content: flex-end;
            justify-content: space-between;
            justify-content: space-around;
            justify-content: space-evenly;


            /* 2. align-items : direction(배치 방향)과 교차축 정렬*/
            /* 2.1 수평배치일 때... 수직 축 정렬*/
            justify-content: flex-start;
            flex-direction: row;
            align-items: flex-start;
            align-items: center;
            align-items: flex-end;
            align-items: stretch; /*기본값, 단 자식 요소의 높이 속성이 명시적으로 있다면.. 무시됨*/
            align-items: baseline; /*요소 박스 기준이 아니라,그 안에 있는 글씨의 하단을 맞추기*/
            align-items: flex-start;

            /* 2.2 수직배치일 때... 수평 축 정렬*/
            flex-direction: column;
            align-items: center;
            align-items: flex-end;
            align-items: stretch; /*기본값, 단 요소의 너비 값(width)이 명시적으로 있다면 무시*/
            align-items: baseline; /* 무의미. 수평축 정렬이기에 글씨 하단을 맞출 수 없음*/

            height: 300px;
            border:2px solid black;

        }
    </style>
</head>
<body>
    
    <!-- flex 스타일 : 자식 요소들의 배치[layout]를 부모요소에서 결정하는 방식-->
    <div id="container">

        <div>aa</div>
        <div style="font-size: 30px;"> bb</div>
        <div>cc</div>

        <!-- <div>aa2</div>
        <div>bb2</div>
        <div>cc2</div>

        <div>aa3</div>
        <div>bb3</div>
        <div>cc3</div> -->
    </div>
    
    <hr>

    <div id="header">
        <h2> Hello </h2>
        <p> This is flex style.</p>

    </div>
    <style>
        #header{
            background-color: blueviolet;
            color: wheat;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center; /*수직의 가운데로*/
            align-items: center; /*진짜 중앙으로*/
        }
    </style>

    <hr>

    <!-- flex 스타일은 기본적으로 부모요소가 자식요소들의 배치와 정렬을 결정 -->
    <!-- 자식요소들만의 개별단위 flex 스타일 속성들을 사용하면 더 다양한 레이아웃이 가능 -->
    
    <div id="container2">
        <div id="c1">aaa</div>
        <div id="c2">bbb</div>
        <div id="c3">ccc</div>
    </div>
    <style>
        #container2>div{
        background-color: aquamarine;
        padding: 20px;
        margin: 10px;   

        }
        #container2{
        display: flex;
        border: 2px solid blue;
        }

        /* 자식 요소들만의 FLEX 스타일 속성을 알아보기 */
        /* 1. order: 배치 순서 결정- 순서 낮은 것이 먼저 배치됨 */
        #c1{order: 5;}
        #c2{order:3;}

        /* 2.flex-grow :너비를 상대적인 값의 비례로 지정 */
        #c1{order:0;
        flex-grow: 1;}
        #c2{order:0;
        flex-grow: 3;}
        #c3{order:0;
        flex-grow: 2;}

        /*3. flex-shrink: 다른 요소들에 비해 얼마나 줄어들지... 를 결정..(별도 예제02.html)*  */
        
        /* 4. (거의 안씀)flex-basis : 요소의 초기 길이 값을 지정 - 화면이 작아지면 flex-basis로 지정한 요소들만 먼저 축소됨  */
        #c1{
            flex-grow: 0;
        }
        #c2{
            flex-grow: 0;
            flex-basis: 200px;
        }
        #c3{
            flex-grow: 0;
            flex-basis: 300px;
        }

        /* 5. 위 3개의 속성을 축약형으로.. flex (-grow -shrink -basis)*/
        #c1{flex: 0 0 0px;}
        #c2{flex: 1 0 0px;}
        #c3{flex: 1 0 0px;}

        /* basis, shrink는 자주 사용 안해서.. 일반적으로 grow 값만 사용 */
        #c1{flex: 2;}
        #c2{flex: 1;}
        #c3{flex: 1;}

        /* 6. 요소 개별 단위 정렬하기 */
        #container2{
            flex-direction: row;
            height: 300px;
        }
        #container2>div{
            height:100px;   
        }

        #c1{align-self: center;}
        #c3{align-self: flex-end;}
        
        /* justify-self도 같은 방식 */
        
    </style>


    
</body>
</html>
